<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Video2Note · 视频图文笔记</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f4ef;color:#203a35;font:15px/1.65 system-ui,"Microsoft YaHei",sans-serif}main{max-width:1160px;margin:auto;padding:30px 24px 48px}.top{display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{font-weight:750;font-size:20px}h1{font-size:32px;line-height:1.4;margin:30px 0 10px}.intro{color:#64776c;max-width:780px;margin-bottom:24px}.generator{background:#fff;border:1px solid #dce4d8;border-radius:14px;padding:24px}.form{display:grid;grid-template-columns:minmax(0,1fr) 205px 160px;gap:14px;align-items:end}label{display:block;font-size:13px;margin-bottom:6px}input,select,button{font:inherit}input,select{width:100%;min-width:0;border:1px solid #d4ddd0;background:#fff;border-radius:7px;padding:11px 12px}button{cursor:pointer;border:0;border-radius:7px;padding:12px 16px;background:#234f3e;color:#fff}button:disabled{cursor:wait;opacity:.6}.help{font-size:12px;color:#6e7c70;margin:12px 0 0}.message{font-size:13px;color:#2a7051;margin:12px 0 0}.error{color:#a34832}.jobs{margin-top:16px;display:grid;gap:10px}.job{border-top:1px solid #e7eae2;padding-top:12px}.job-head{display:flex;gap:14px;justify-content:space-between;align-items:baseline}.job-head strong{font-size:13px}.job small{color:#6f7d71}.bar{height:4px;background:#e7eee3;border-radius:4px;overflow:hidden;margin:8px 0}.bar span{display:block;height:100%;background:#5d8a67}section.library{margin-top:34px}.library-head{display:flex;gap:18px;justify-content:space-between;align-items:center}.library-head h2{font-size:23px;margin:0}#search{max-width:330px}.count{font-size:13px;color:#748171;margin-left:10px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.filter{background:#e9ede3;color:#50644f;font-size:13px;padding:7px 13px;border:1px solid transparent}.filter[aria-pressed="true"]{background:#234f3e;color:#fff}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.card{background:#fff;border:1px solid #dfe5d9;border-radius:12px;padding:22px;display:flex;flex-direction:column}.card h3{font-size:18px;line-height:1.5;margin:12px 0}.card p{font-size:13px;color:#63756a;flex:1;margin:0 0 16px}.meta{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:#6e7e6a}.subtype{font-size:12px;color:#887647;margin-bottom:10px}.actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center;font-size:13px}a{color:#326b50;text-decoration:none}a:hover{text-decoration:underline}.open{background:#234f3e;color:#fff;border-radius:6px;padding:7px 10px}.pending{color:#a07235}.empty{grid-column:1/-1;background:#fff;border:1px dashed #d1dacb;border-radius:10px;padding:28px;color:#718068}@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.form{grid-template-columns:minmax(0,1fr) 200px}.submit{grid-column:1/-1}}@media(max-width:560px){main{padding:24px 15px}h1{font-size:27px}.generator{padding:18px}.form,.grid{grid-template-columns:1fr}.submit{grid-column:auto}.library-head{align-items:start;flex-direction:column}#search{max-width:none}.job-head{flex-direction:column;gap:4px}}
</style></head><body><main>
<header class="top"><div class="brand">Video2Note</div></header>
<h1>视频转图文笔记</h1>
<p class="intro">内容摘要 · 关键截图 · 时间戳回看</p>
<div class="generator"><form id="generate-form" class="form"><div><label for="video-url">视频链接</label><input id="video-url" name="url" type="url" placeholder="https://www.bilibili.com/video/BV…" required></div><div><label for="category">笔记类型</label><select id="category"><option value="restaurant">探店攻略</option></select></div><button class="submit" id="generate-button" type="submit">生成笔记</button></form>
<p class="help">支持 B 站中文探店视频 · 最长 20 分钟</p><p class="message" id="message" aria-live="polite"></p><div id="jobs" class="jobs"></div></div>
<section class="library"><div class="library-head"><h2>我的笔记 <span class="count" id="count"></span></h2><input id="search" type="search" aria-label="搜索已保存笔记" placeholder="搜索标题或分类"></div><div class="filters" id="filters" aria-label="笔记分类"></div><div class="grid" id="library"></div></section>

</main><script id="initial-library" type="application/json">__LIBRARY_DATA__</script><script>
const el=id=>document.getElementById(id);let library=JSON.parse(el('initial-library').textContent).videos,activeCategory='全部',jobs=[];
function node(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}
function duration(seconds){seconds=Math.round(seconds);return seconds>=3600?Math.floor(seconds/3600)+':'+String(Math.floor(seconds/60)%60).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0'):String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0')}
function link(text,url,cls){const a=node('a',text,cls);a.href=url;a.target='_blank';a.rel='noopener';return a}
function drawFilters(){const categories=['全部',...new Set(library.map(e=>e.category))];el('filters').replaceChildren();for(const category of categories){const count=category==='全部'?library.length:library.filter(e=>e.category===category).length;const b=node('button',category+' '+count,'filter');b.type='button';b.setAttribute('aria-pressed',String(activeCategory===category));b.onclick=()=>{activeCategory=category;drawFilters();drawLibrary()};el('filters').append(b)}}
function drawLibrary(){const q=el('search').value.trim().toLowerCase();const shown=library.filter(e=>(activeCategory==='全部'||e.category===activeCategory)&&[e.title,e.category,e.subtype,e.video_id].join(' ').toLowerCase().includes(q));el('count').textContent=shown.length+' 条';el('library').replaceChildren();for(const e of shown){const card=node('article',undefined,'card');card.dataset.videoId=e.video_id;const meta=node('div',undefined,'meta');meta.append(node('span',e.category),node('span',duration(e.duration)));card.append(meta,node('h3',e.title));if(e.subtype)card.append(node('div',e.subtype,'subtype'));card.append(node('p',e.description||(e.ready?'图文笔记与源视频':'原视频已收录，笔记待生成')));const actions=node('div',undefined,'actions');actions.append(e.ready?link('打开笔记 ↗',e.note_url,'open'):node('span','待生成','pending'));if(e.markdown_url)actions.append(link('Markdown',e.markdown_url));actions.append(link('原视频',e.source_url));card.append(actions);el('library').append(card)}if(!shown.length)el('library').append(node('div','当前条件下没有匹配的笔记。','empty'))}
function drawJobs(){el('jobs').replaceChildren();for(const job of jobs.slice(0,3)){const box=node('div',undefined,'job');const head=node('div',undefined,'job-head');head.append(node('strong',job.title),node('small',job.error||(job.status==='completed'?'已完成':job.stage)));box.append(head);const bar=node('div',undefined,'bar'),fill=node('span');fill.style.width=Math.max(0,Math.min(100,job.progress||0))+'%';bar.append(fill);box.append(bar);if(job.status==='completed'&&job.note_url)box.append(link('打开笔记 ↗',job.note_url));el('jobs').append(box)}}
async function api(path,options){const response=await fetch(path,options);const data=await response.json();if(!response.ok)throw Error(data.error||'本地服务请求失败');return data}
async function refresh(){try{const [saved,state]=await Promise.all([api('/api/library'),api('/api/jobs')]);if(el('message').dataset.connectionError==='1'){el('message').textContent='';el('message').className='message';delete el('message').dataset.connectionError}library=saved.videos;jobs=state.jobs;drawFilters();drawLibrary();drawJobs()}catch(error){el('message').dataset.connectionError='1';el('message').className='message error';el('message').textContent='服务连接中断，请重新启动工具。'}}
el('search').oninput=drawLibrary;
el('generate-form').onsubmit=async event=>{event.preventDefault();delete el('message').dataset.connectionError;el('generate-button').disabled=true;el('message').className='message';try{const result=await api('/api/jobs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:el('video-url').value,category:el('category').value})});el('message').textContent=result.reused?'已存在笔记或处理任务。':'任务已提交。';await refresh()}catch(error){el('message').className='message error';el('message').textContent=error.message}finally{el('generate-button').disabled=false}};
drawFilters();drawLibrary();refresh();setInterval(refresh,5000);
</script></body></html>
